<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hola n8n</title>
</head>
<body>
  <h1>Hola n8n</h1>
  <input type="text" id="texto" placeholder="Escribe algo">
  <button id="enviar">Enviar</button>
  <p id="resultado"></p>

  <script>
    const boton = document.getElementById("enviar");
    const campo = document.getElementById("texto");
    const resultado = document.getElementById("resultado");

    boton.addEventListener("click", async () => {
      resultado.textContent = "Enviando...";
      try {
        const respuesta = await fetch("/enviar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto: campo.value }),
        });
        const datos = await respuesta.json();
        resultado.textContent = datos.respuesta || datos.error;
      } catch (error) {
        resultado.textContent = "Error al conectar con el servidor";
      }
    });
  </script>
</body>
</html>
